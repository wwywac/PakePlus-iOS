<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>国际物流 · 快船时效稳定 · 轨迹追踪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #4F81BD;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #0b1f3b;
        }

        .header {
            background: url('5c882ec165968(1)(1).jpg') center/cover no-repeat;
            min-height: 280px;
            padding: 24px 40px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            gap: 20px;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 20, 50, 0.2);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 65%;
            bottom: 0;
            background: linear-gradient(90deg, rgba(0, 40, 80, 0.6) 0%, rgba(0, 40, 80, 0.2) 80%, transparent 100%);
            z-index: 0;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-img {
            height: 144px;
            width: auto;
            filter: drop-shadow(0 6px 20px rgba(0, 20, 50, 0.4));
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        .logo-img:hover {
            transform: scale(1.08) rotate(-2deg);
            filter: drop-shadow(0 10px 28px rgba(0, 20, 50, 0.5));
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand h2 {
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1.1;
            text-shadow: 0 2px 12px rgba(0, 20, 50, 0.5);
        }

        .brand h2 span {
            font-size: 36px;
            filter: drop-shadow(0 2px 4px rgba(0, 20, 50, 0.3));
        }

        .badge-stable {
            background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 100%);
            color: #0d3b7a;
            font-size: 19px;
            font-weight: 700;
            padding: 10px 26px 10px 22px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
            box-shadow: 0 6px 20px rgba(0, 20, 50, 0.25);
            white-space: nowrap;
            width: fit-content;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .badge-stable i {
            font-style: normal;
            font-size: 23px;
            line-height: 1;
        }

        .badge-stable::after {
            content: "⚡";
            font-size: 21px;
            margin-left: 4px;
            filter: drop-shadow(0 0 4px rgba(255,180,0,0.5));
        }

        .status-pulse {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 24px 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            white-space: nowrap;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(0, 20, 50, 0.15);
            text-shadow: 0 1px 4px rgba(0, 20, 50, 0.3);
            flex-shrink: 0;
        }
        .status-dot {
            width: 14px;
            height: 14px;
            background: #00e5a0;
            border-radius: 50%;
            box-shadow: 0 0 0 6px rgba(0, 229, 160, 0.2);
            animation: pulse-dot 2.4s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.8; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.8; transform: scale(0.9); }
        }

        .tabs-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .tab {
            padding: 13px 30px;
            border-radius: 100px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 8px rgba(0, 20, 50, 0.1);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 3px rgba(0, 20, 50, 0.3);
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .tab:hover::before {
            left: 100%;
        }

        .tab i {
            font-style: normal;
            font-size: 21px;
            filter: drop-shadow(0 1px 2px rgba(0, 20, 50, 0.3));
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 20, 50, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .tab.active {
            background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 100%);
            color: #0d3b7a;
            box-shadow: 0 10px 28px rgba(0, 20, 50, 0.25);
            font-weight: 700;
            border-color: rgba(255, 255, 255, 0.5);
            text-shadow: none;
        }

        .tab.external {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .tab.external::after {
            content: "↗";
            font-size: 17px;
            font-weight: 400;
            opacity: 0.7;
            margin-left: 6px;
            transition: 0.2s;
        }

        .tab.external:hover::after {
            opacity: 1;
            transform: translate(2px, -2px);
        }

        .tab.external.active {
            background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 100%);
            border-color: rgba(255, 255, 255, 0.5);
            color: #0d3b7a;
        }
        .tab.external.active::after {
            opacity: 0.9;
            color: #0d3b7a;
        }

        /* 缩放控制 */
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 20, 50, 0.1);
        }
        .zoom-btn {
            background: transparent;
            border: none;
            border-radius: 30px;
            padding: 8px 22px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            text-shadow: 0 1px 3px rgba(0, 20, 50, 0.3);
        }
        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .zoom-btn.active-zoom {
            background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 100%);
            color: #0d3b7a;
            box-shadow: 0 6px 16px rgba(0, 20, 50, 0.2);
            text-shadow: none;
        }
        .zoom-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            padding: 0 8px;
            text-shadow: 0 1px 3px rgba(0, 20, 50, 0.3);
        }

        .iframe-wrapper {
            flex: 1;
            padding: 16px 32px 28px 32px;
            background: transparent;
            display: flex;
            align-items: stretch;
            min-height: 0;
        }

        .iframe-card {
            flex: 1;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0, 20, 50, 0.15), 0 2px 8px rgba(0, 20, 40, 0.05);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: box-shadow 0.25s;
        }

        .iframe-card:hover {
            box-shadow: 0 24px 64px rgba(0, 30, 70, 0.18);
        }

        .iframe-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1a5fb4 0%, #c62828 50%, #1a5fb4 100%);
            opacity: 0.7;
            z-index: 5;
            border-radius: 24px 24px 0 0;
        }

        .iframe-zoom-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #ffffff;
            border-radius: 24px;
            position: relative;
        }

        .iframe-zoom-container iframe {
            border: none;
            display: block;
            background: #ffffff;
            transform-origin: top left;
            transition: transform 0.15s ease;
        }

        /* 响应式 */
        @media (max-width: 1400px) {
            .header { min-height: 260px; padding: 22px 32px 18px 32px; }
            .logo-img { height: 120px; }
            .brand h2 { font-size: 32px; }
            .brand h2 span { font-size: 30px; }
            .badge-stable { font-size: 16px; padding: 8px 20px; }
            .badge-stable i { font-size: 20px; }
            .badge-stable::after { font-size: 18px; }
            .status-pulse { font-size: 15px; padding: 8px 20px; }
            .status-dot { width: 12px; height: 12px; box-shadow: 0 0 0 5px rgba(0, 229, 160, 0.2); }
            .tab { font-size: 16px; padding: 11px 24px; }
            .tab i { font-size: 18px; }
            .tab.external::after { font-size: 14px; }
            .zoom-btn { font-size: 14px; padding: 6px 18px; }
            .zoom-label { font-size: 15px; }
            .zoom-control { padding: 6px 12px; }
            .iframe-wrapper { padding: 14px 28px 24px 28px; }
        }

        @media (max-width: 1024px) {
            .header { min-height: 240px; padding: 20px 24px 16px 24px; gap: 18px; }
            .logo-img { height: 100px; }
            .brand h2 { font-size: 26px; }
            .brand h2 span { font-size: 24px; }
            .badge-stable { font-size: 13px; padding: 6px 16px; }
            .badge-stable i { font-size: 16px; }
            .badge-stable::after { font-size: 14px; }
            .status-pulse { font-size: 13px; padding: 6px 16px; }
            .status-dot { width: 10px; height: 10px; box-shadow: 0 0 0 4px rgba(0, 229, 160, 0.2); }
            .tab { font-size: 14px; padding: 9px 18px; }
            .tab i { font-size: 15px; }
            .tab.external::after { font-size: 13px; }
            .zoom-btn { font-size: 13px; padding: 5px 14px; }
            .zoom-label { font-size: 13px; }
            .zoom-control { padding: 5px 10px; }
            .header-top { gap: 20px; }
            .header-left { gap: 16px; }
            .tabs-wrapper { gap: 12px; }
            .tabs { gap: 8px; }
            .iframe-wrapper { padding: 12px 20px 20px 20px; }
        }

        @media (max-width: 820px) {
            .header { min-height: 220px; padding: 18px 16px 14px 16px; gap: 14px; }
            .logo-img { height: 80px; }
            .brand h2 { font-size: 22px; }
            .brand h2 span { font-size: 20px; }
            .badge-stable { font-size: 11px; padding: 5px 14px; }
            .badge-stable i { font-size: 13px; }
            .badge-stable::after { font-size: 11px; }
            .status-pulse { font-size: 11px; padding: 5px 14px; }
            .status-dot { width: 8px; height: 8px; box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.2); }
            .tab { font-size: 12px; padding: 7px 14px; }
            .tab i { font-size: 13px; }
            .tab.external::after { font-size: 11px; }
            .zoom-btn { font-size: 11px; padding: 4px 12px; }
            .zoom-label { font-size: 11px; }
            .zoom-control { padding: 4px 8px; }
            .header-top { gap: 14px; }
            .header-left { gap: 12px; }
            .tabs-wrapper { gap: 10px; }
            .tabs { gap: 6px; }
            .iframe-wrapper { padding: 10px 16px 16px 16px; }
        }

        @media (max-width: 600px) {
            .header { min-height: 200px; padding: 14px 12px 12px 12px; gap: 12px; }
            .header::before { width: 80%; }
            .header-top { flex-direction: column; gap: 10px; }
            .header-left { justify-content: center; gap: 8px; flex-direction: column; }
            .logo-img { height: 72px; }
            .brand h2 { font-size: 20px; }
            .brand h2 span { font-size: 18px; }
            .badge-stable { font-size: 10px; padding: 4px 10px; }
            .badge-stable i { font-size: 11px; }
            .badge-stable::after { font-size: 10px; }
            .status-pulse { font-size: 10px; padding: 4px 12px; }
            .status-dot { width: 7px; height: 7px; box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.2); }
            .tabs-wrapper { flex-direction: column; gap: 8px; }
            .tabs { gap: 5px; justify-content: center; }
            .tab { font-size: 11px; padding: 6px 12px; }
            .tab i { font-size: 12px; }
            .tab.external::after { font-size: 10px; }
            .zoom-btn { font-size: 10px; padding: 3px 10px; }
            .zoom-label { font-size: 10px; }
            .zoom-control { padding: 3px 6px; gap: 4px; }
            .iframe-wrapper { padding: 6px 12px 12px 12px; }
            .iframe-card { border-radius: 20px; }
            .iframe-zoom-container { border-radius: 20px; }
            .iframe-card::before { border-radius: 20px 20px 0 0; }
        }

        @media (max-width: 420px) {
            .header { min-height: 180px; padding: 10px 8px 8px 8px; gap: 8px; }
            .logo-img { height: 56px; }
            .brand h2 { font-size: 16px; }
            .brand h2 span { font-size: 15px; }
            .badge-stable { font-size: 9px; padding: 3px 8px; }
            .badge-stable i { font-size: 10px; }
            .badge-stable::after { font-size: 9px; }
            .status-pulse { font-size: 9px; padding: 3px 10px; }
            .status-dot { width: 6px; height: 6px; box-shadow: 0 0 0 2px rgba(0, 229, 160, 0.2); }
            .tab { font-size: 9px; padding: 4px 10px; }
            .tab i { font-size: 10px; }
            .tab.external::after { font-size: 9px; margin-left: 3px; }
            .zoom-btn { font-size: 8px; padding: 2px 8px; }
            .zoom-label { font-size: 9px; padding: 0 4px; }
            .zoom-control { padding: 2px 4px; gap: 2px; }
            .header-top { gap: 6px; }
            .header-left { gap: 6px; }
            .tabs-wrapper { gap: 6px; }
            .tabs { gap: 3px; }
            .iframe-wrapper { padding: 4px 8px 8px 8px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <div class="brand">
                    <img src="图片1.png" alt="JMT Logo" class="logo-img" title="JMT 国际物流">
                    <div class="brand-text">
                        <h2><span>📦</span> 轨迹查询</h2>
                        <div class="status-pulse">
                             <span class=></span><i>🚢</i> 快船时效稳定
                        </div>
                    </div>
                </div>
                <div class="status-pulse">
                    <span class="status-dot"></span> 在线 · 实时
                </div>
            </div>
        </div>
        <div class="tabs-wrapper">
            <div class="tabs">
                <button class="tab" onclick="switchApp(this, '6342b14569c1d6728773ed3e')">普货查询1</button>
                <button class="tab external active" onclick="loadExternalInIframe('http://www.myline56.com/', this)">普货查询2</button>
                <button class="tab" onclick="switchApp(this, '67bd8f7ec4a8b90d1c7f3843')">敏感货查询1</button>
                <button class="tab" onclick="switchApp(this, '6a290d2981cc2201d74ef67c')">敏感货查询2</button>
                <button class="tab external" onclick="openExternal('https://www.fedex.com/zh-cn/home.html', this)">清关后点击联邦官网查询派送时间</button>
                <button class="tab external" onclick="openExternal('https://www.ups.com/cn/zh/home', this)">清关后点击UPS官网查询派送时间</button>
            </div>
            <div class="zoom-control">
                <span class="zoom-label">🔍</span>
                <button class="zoom-btn" data-zoom="0.5" onclick="setZoom(0.5, this)">0.5x</button>
                <button class="zoom-btn active-zoom" data-zoom="0.75" onclick="setZoom(0.75, this)">0.75x</button>
                <button class="zoom-btn" data-zoom="1.0" onclick="setZoom(1.0, this)">1.0x</button>
            </div>
        </div>
    </div>

    <div class="iframe-wrapper">
        <div class="iframe-card">
            <div class="iframe-zoom-container" id="zoomContainer">
                <iframe id="viewer" src="http://www.myline56.com/"></iframe>
            </div>
        </div>
    </div>

    <script>
        const baseUrl = 'http://tracking.nextsls.com/trace?app=';

        function switchApp(btn, appId) {
            const iframe = document.getElementById('viewer');
            iframe.src = baseUrl + appId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            setZoom(0.75, document.querySelector('.zoom-btn[data-zoom="0.75"]'));
        }

        function loadExternalInIframe(url, btn) {
            const iframe = document.getElementById('viewer');
            iframe.src = url;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            setZoom(0.75, document.querySelector('.zoom-btn[data-zoom="0.75"]'));
        }

        function setZoom(zoomLevel, btn) {
            const iframe = document.getElementById('viewer');
            const width = 100 / zoomLevel;
            iframe.style.width = width + '%';
            iframe.style.height = width + '%';
            iframe.style.transform = 'scale(' + zoomLevel + ')';
            iframe.style.transformOrigin = 'top left';

            document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active-zoom'));
            if (btn) {
                btn.classList.add('active-zoom');
            } else {
                document.querySelector('.zoom-btn[data-zoom="' + zoomLevel + '"]')?.classList.add('active-zoom');
            }
        }

        function openExternal(url, btn) {
            window.open(url, '_blank');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        window.addEventListener('load', function() {
            setTimeout(function() {
                setZoom(0.75, document.querySelector('.zoom-btn[data-zoom="0.75"]'));
            }, 120);
        });
    </script>
</body>
</html>
